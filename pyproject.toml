[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "frontend",
    "data",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "DTZ", "LOG", "G", "RUF", "ASYNC"]
ignore = [
    "E501",    # long lines are a formatting concern, not a lint failure
    "G004",    # f-strings in log calls are the established idiom across every service
    "RUF012",  # mutable class attributes are intentional in the Pydantic models
    "ASYNC240",# os.path.exists/os.remove on a temp file is a sub-millisecond syscall;
               # ASYNC230 (blocking open/read) is the rule worth enforcing here
    "UP042",   # str+Enum -> StrEnum changes str() output and the persisted shape of
               # role/status values in MongoDB; not worth the migration risk
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import time by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Every entry point bootstraps sys.path before importing the shared package.
"cli/**" = ["E402"]
"scripts/**" = ["E402"]
"tests/**" = ["E402", "S101", "S105", "S106", "S108"]
"services/*/src/main.py" = ["E402"]
# Local development servers deliberately bind all interfaces inside their container.
"scripts/dev_server.py" = ["E402", "S104"]
"scripts/frontend_server.py" = ["E402", "S104", "S310"]
# Synthetic dataset generation; randomness here is statistical, never cryptographic.
"scripts/generate_sample_data.py" = ["E402", "S311"]
# Hadoop/Spark are invoked with argument lists built from validated job configuration.
"jobs/mapreduce/runner.py" = ["S603"]
"jobs/streaming/spark_stream_processor.py" = ["S108"]
"shared/engines/full_bda.py" = ["S603"]
# WebHDFS endpoints are constructed from operator-supplied configuration, not user input.
"shared/hdfs.py" = ["S310"]
# SQL is assembled only from whitelisted templates. Every interpolated value is either
# int()/float()-coerced and bounds-checked, run through sanitize_parameter(), or a
# server-side path; execute_analytical_query() additionally calls validate_query_safety().
"shared/engines/render_lite.py" = ["S608"]
"services/hive-query-service/src/engine.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "jobs", "scripts", "cli"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Gated on the shared library only: it is imported by every service, so a type error
# here propagates everywhere. services/, cli/ and scripts/ still carry ~95 findings and
# are not gated yet, so that this check stays a real signal rather than a green sticker.
files = ["shared"]

# numpy 2.x ships stubs that use 3.12+ `type` statements, which mypy cannot parse when
# targeting 3.11. Nothing in shared/ uses them directly; they are reached transitively
# through duckdb, so skip following into them.
[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
