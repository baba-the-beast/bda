name: CI / CD Security and Pipeline Validation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run mypy (shared library)
        run: mypy

  unit-and-integration-tests:
    name: Test Suite & Security Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite with Coverage
        run: pytest tests/ --cov=. --cov-report=xml

      - name: Run Analytics Correctness Verification (Math vs MR vs Hive)
        run: python tests/correctness/verify_analytics.py

  frontend-build:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom's undici calls webidl.util.markAsUncloneable,
          # which Node 20 does not have, so every Vitest worker fails to start.
          # Vite 6 and Vitest 5 also want 20.19+/22.12+.
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Format Check
        run: npm run format:check
        working-directory: frontend

      - name: Unit Tests
        run: npm run test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Bundle Budget
        run: npm run size
        working-directory: frontend

      - name: Install Playwright Browser
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: End-to-End Smoke & Accessibility
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  kubernetes-validation:
    name: Kubernetes & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Helm Lint
        run: helm lint infrastructure/helm/energy-platform
