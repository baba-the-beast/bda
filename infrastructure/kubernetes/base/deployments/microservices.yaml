apiVersion: apps/v1
kind: Deployment
metadata:
  name: bda-api-gateway
  namespace: bda-energy
  labels:
    app: bda-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bda-api-gateway
  template:
    metadata:
      labels:
        app: bda-api-gateway
    spec:
      serviceAccountName: bda-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api-gateway
          image: bda/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bda-platform-config
            - secretRef:
                name: bda-platform-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
