apiVersion: apps/v1
kind: Deployment
metadata:
  name: bda-frontend
  namespace: bda-energy
  labels:
    app: bda-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bda-frontend
  template:
    metadata:
      labels:
        app: bda-frontend
    spec:
      containers:
        - name: frontend
          image: bda/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
