# =============================================================================
# Render Blueprint for Big Data Energy Consumption Analytics Platform
# Backend API only, on the free plan. The frontend is deployed to Vercel
# (see frontend/vercel.json and docs/DEPLOYMENT.md).
#
# Batch jobs run inside the API process (job-orchestrator submits them to its
# own executor), so no separate background worker is needed.
# =============================================================================

services:
  - type: web
    name: bda-backend-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/dev_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: BDA_MODE
        value: RENDER_LITE
      - key: DATA_STORE_MODE
        value: mongodb
      - key: ENABLE_DEMO_SEED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated frontend origins, e.g. https://bda-energy.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOCAL_HDFS_ROOT
        value: /opt/render/project/src/data/hdfs
